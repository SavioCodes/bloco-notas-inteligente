name: Bug report
description: Reporte um erro no app
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Explique o erro com detalhes.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema operacional
      placeholder: Windows 11, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Versao do Python
      placeholder: Python 3.11.9
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra o app\n2. Clique em...\n3. Veja o erro"
  - type: textarea
    id: logs
    attributes:
      label: Logs ou mensagem de erro
      render: text

